[package]
name = "shield-vault-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "shield_vault_core"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5.3"
bcs = "0.2.1"
libsodium-rs = "0.2.4"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand = "0.8"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"

